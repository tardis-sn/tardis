tardis_config_version: v1.0

supernova:
  luminosity_requested: 5e42 erg/s
  time_explosion: 16.0 day

atom_data: christians_atomdata_converted_04Dec25.h5

model:
  structure:
    type: file
    filename: iip_hydrogen_helium_density.dat
    filetype: simple_ascii
    v_inner_boundary: 8000 km/s
    v_outer_boundary: 10000 km/s
  abundances:
    type: uniform
    H: 0.7
    He: 0.3

plasma:
  disable_electron_scattering: false
  excitation: dilute-lte
  ionization: nebular
  radiative_rates_type: dilute-blackbody
  line_interaction_type: macroatom
  initial_t_inner: 8000 K
  continuum_interaction:
    species:
      - H I
  link_t_rad_t_electron: 1.0

montecarlo:
  seed: 23111963
  no_of_packets: 2.0e+5
  last_no_of_packets: 2.0e+5
  no_of_virtual_packets: 0
  iterations: 2
  nthreads: 1
  convergence_strategy:
    type: damped
    damping_constant: 1.0
    threshold: 0.05
    fraction: 0.8
    hold_iterations: 3
    t_inner:
      damping_constant: 0.5
    stop_if_converged: false

spectrum:
  start: 500 angstrom
  stop: 20000 angstrom
  num: 1000
