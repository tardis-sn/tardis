tardis_config_version: v1.0

supernova:
  luminosity_requested: 8.61 log_lsun
  time_explosion: 50 day

atom_data: christians_atomdata_converted_04Dec25.h5

model:
  structure:
    type: file
    filename: iip_population_cutoff_density.dat
    filetype: simple_ascii
    v_inner_boundary: 3001 km/s
    v_outer_boundary: 10650 km/s
  abundances:
    type: uniform
    H: 1.0

plasma:
  disable_electron_scattering: false
  excitation: dilute-lte
  ionization: nebular
  radiative_rates_type: dilute-blackbody
  line_interaction_type: macroatom
  initial_t_inner: 5000 K
  continuum_interaction:
    species:
      - H I
  link_t_rad_t_electron: 1.0

montecarlo:
  seed: 23111963
  no_of_packets: 1000
  last_no_of_packets: 1000
  no_of_virtual_packets: 0
  iterations: 2
  nthreads: 2
  convergence_strategy:
    type: damped
    damping_constant: 0.5
    threshold: 0.05
    fraction: 0.8
    hold_iterations: 1
    stop_if_converged: false

spectrum:
  start: 500 angstrom
  stop: 25000 angstrom
  num: 1000
