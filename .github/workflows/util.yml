name: utility

on:
  pull_request_target:
    branches:
      - master

# pull_request_target runs with secrets, so no job checks out or runs PR code.
permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  mailmap:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR authors
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          authors=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/commits" --paginate --jq '.[].commit.author | "\(.name) <\(.email)>"')
          gh api "repos/$HEAD_REPO/contents/.mailmap?ref=$HEAD_SHA" -H 'Accept: application/vnd.github.raw' | grep -F "$authors" || {
            echo "Committer name or email couldn't be found in .mailmap"
            echo "$authors"
            exit 1
          }

  comment-on-mailmap-failure:
    needs: mailmap
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.BOT_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            *\*beep\* \*bop\**

            Hi, human.

            I'm the @tardis-bot and couldn't find your records in my database. I think we don't know each other, or you changed your credentials recently.

            Please add your **name** and **email** to `.mailmap` in your current branch and push the changes to this pull request.

            In case you need to map an existing alias, follow [this example](https://docs.enterprise.codescene.io/versions/2.0.0/getting-started/ensure-you-use-a-mailmap.html).

  close-gsoc-pull-request:
    if: >
      github.event.action == 'opened' &&
      contains(fromJSON('["FIRST_TIMER", "FIRST_TIME_CONTRIBUTOR", "NONE"]'), github.event.pull_request.author_association) &&
      (contains(github.event.pull_request.title, 'gsoc') || contains(github.event.pull_request.title, 'google summer of code') ||
      contains(github.event.pull_request.body, 'gsoc') || contains(github.event.pull_request.body, 'google summer of code'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.BOT_TOKEN }}
      NUMBER: ${{ github.event.pull_request.number }}
      BODY: |
        👋 Hi @${{ github.event.pull_request.user.login }}, thanks for your interest in TARDIS.

        This pull request mentions Google Summer of Code. We don't have the capacity to review GSoC pull requests at the moment, so we are closing it.

        If this is not a Google Summer of Code pull request, please reopen it.
    steps:
      - run: gh pr edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label 'GSoC :sun_with_face:'
      - run: gh pr close "$NUMBER" --repo "$GITHUB_REPOSITORY" --comment "$BODY"

  first-time-contributor:
    if: >
      github.event.action == 'opened' &&
      contains(fromJSON('["FIRST_TIMER", "FIRST_TIME_CONTRIBUTOR", "NONE"]'), github.event.pull_request.author_association) &&
      !(contains(github.event.pull_request.title, 'gsoc') || contains(github.event.pull_request.title, 'google summer of code') ||
      contains(github.event.pull_request.body, 'gsoc') || contains(github.event.pull_request.body, 'google summer of code'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.BOT_TOKEN }}
      NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # Read .mailmap from master so a PR cannot add its own entry to avoid closing.
      - id: master-mailmap
        run: |
          authors=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/commits" --paginate --jq '.[].commit.author | "\(.name) <\(.email)>"')
          mailmap=$(gh api "repos/$GITHUB_REPOSITORY/contents/.mailmap?ref=master" -H 'Accept: application/vnd.github.raw')
          grep -qF "$authors" <<< "$mailmap" && echo found=true >> "$GITHUB_OUTPUT" || echo found=false >> "$GITHUB_OUTPUT"

      - if: steps.master-mailmap.outputs.found == 'false'
        env:
          BODY: |
            👋 Welcome @${{ github.event.pull_request.user.login }}! Thank you for your first contribution to this repository!

            Since your name and email are not in `.mailmap` on the master branch, we are assuming this is a Google Summer of Code pull request and hence closing it.

            If you don't know what Google Summer of Code is and aren't applying to it, please reopen this pull request.

            If you are planning to apply to the program please keep it closed, we don't have the capacity to review GSoC pull requests at the moment.
        run: gh pr close "$NUMBER" --repo "$GITHUB_REPOSITORY" --comment "$BODY"

      - if: steps.master-mailmap.outputs.found == 'true'
        env:
          BODY: |
            👋 Welcome @${{ github.event.pull_request.user.login }}! Thank you for your first contribution to this repository!

            A reviewer will take a look at your pull request soon.

            Please mark the pull request as draft if you are not ready for review yet or if there are things you will be adding.
        run: gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
