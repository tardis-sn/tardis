name: utility

on:
  pull_request_target:
    types: [opened]
    branches:
      - master
  workflow_run:
    workflows: [mailmap]
    types: [completed]

jobs:
  close-gsoc-pull-request:
    if: >
      github.event_name == 'pull_request_target' && (
      contains(github.event.pull_request.title, 'gsoc') ||
      contains(github.event.pull_request.body, 'gsoc') ||
      contains(github.event.pull_request.title, 'google summer of code') ||
      contains(github.event.pull_request.body, 'google summer of code'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.BOT_TOKEN }}
      NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - run: gh pr edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label 'GSoC :sun_with_face:'

      - uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.BOT_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            👋 Hi @${{ github.event.pull_request.user.login }}, thanks for your interest in TARDIS.

            This pull request mentions Google Summer of Code. We don't have the capacity to review GSoC pull requests at the moment, so we are closing it.

            If this is not a Google Summer of Code pull request, please reopen it.

      - run: gh pr close "$NUMBER" --repo "$GITHUB_REPOSITORY"

  resolve-pull-request:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.find-workflow-run-pr.outputs.matching-pr-count == '1' && steps.find-workflow-run-pr.outputs.head-sha == github.event.workflow_run.head_sha && steps.find-workflow-run-pr.outputs.number || '' }}
      login: ${{ steps.find-workflow-run-pr.outputs.author }}
      association: ${{ steps.get-author-association.outputs.value }}
    steps:
      - id: find-workflow-run-pr
        uses: juliangruber/find-pull-request-action@v1
        with:
          github-token: ${{ github.token }}
          branch: ${{ github.event.workflow_run.head_repository.owner.login }}:${{ github.event.workflow_run.head_branch }}
          base: master
          state: open

      - id: get-author-association
        if: steps.find-workflow-run-pr.outputs.matching-pr-count == '1'
        run: echo "value=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq .author_association)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.find-workflow-run-pr.outputs.number }}

  close-missing-mailmap-entry:
    needs: resolve-pull-request
    if: needs.resolve-pull-request.outputs.number != '' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.BOT_TOKEN }}
      NUMBER: ${{ needs.resolve-pull-request.outputs.number }}
    steps:
      - uses: peter-evans/find-comment@v3
        id: find-close-notice
        with:
          issue-number: ${{ needs.resolve-pull-request.outputs.number }}
          body-includes: we are assuming this is a Google Summer of Code pull request

      - if: steps.find-close-notice.outputs.comment-id == ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.BOT_TOKEN }}
          issue-number: ${{ needs.resolve-pull-request.outputs.number }}
          body: |
            👋 Welcome @${{ needs.resolve-pull-request.outputs.login }}! Thank you for your first contribution to this repository!

            Since this pull request doesn't add your entry to `.mailmap`, we are assuming this is a Google Summer of Code pull request and hence closing it.

            If you don't know what Google Summer of Code is and aren't applying to it, please reopen this pull request.

            If you are planning to apply to the program please keep it closed, we don't have the capacity to review GSoC pull requests at the moment.

      - if: steps.find-close-notice.outputs.comment-id == ''
        run: gh pr close "$NUMBER" --repo "$GITHUB_REPOSITORY"

  welcome-first-time-contributor:
    needs: resolve-pull-request
    if: >
      needs.resolve-pull-request.outputs.number != '' &&
      github.event.workflow_run.conclusion == 'success' &&
      contains(fromJSON('["FIRST_TIMER", "FIRST_TIME_CONTRIBUTOR"]'), needs.resolve-pull-request.outputs.association)
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/find-comment@v3
        id: find-welcome-comment
        with:
          issue-number: ${{ needs.resolve-pull-request.outputs.number }}
          body-includes: A reviewer will take a look at your pull request soon

      - if: steps.find-welcome-comment.outputs.comment-id == ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.BOT_TOKEN }}
          issue-number: ${{ needs.resolve-pull-request.outputs.number }}
          body: |
            👋 Welcome @${{ needs.resolve-pull-request.outputs.login }}! Thank you for your first contribution to this repository!

            A reviewer will take a look at your pull request soon.

            Please mark the pull request as draft if you are not ready for review yet or if there are things you will be adding.
