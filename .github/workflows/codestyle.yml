#
#    https://tardis-sn.github.io/tardis/contributing/development/continuous_integration.html

name: codestyle

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

permissions:
  contents: read

defaults:
  run:
    shell: bash -l {0}

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup environment
        uses: tardis-sn/tardis-actions/setup-env@main
        with:
          os-label: linux-64
          lockfile-path: ./conda-linux-64.lock

      - name: Run Ruff on changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git diff --diff-filter=ACMRTUXB --name-only -z \
            "${BASE_SHA}" "${HEAD_SHA}" -- "*.py" "*.pyi" "*.ipynb" |
            xargs -0 --no-run-if-empty \
              ruff check --output-format=github --exit-zero --
