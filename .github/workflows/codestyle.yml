#
#    https://tardis-sn.github.io/tardis/contributing/development/continuous_integration.html

name: codestyle

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

permissions:
  contents: read

defaults:
  run:
    shell: bash -l {0}

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup environment
        uses: tardis-sn/tardis-actions/setup-env@main
        with:
          os-label: linux-64
          lockfile-path: ./conda-linux-64.lock

      - name: Install diff-quality
        run: python -m pip install diff-cover==10.4.1

      - name: Run Ruff on changed Python lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          diff-quality \
            --violations=ruff.check \
            --compare-branch="${BASE_SHA}" \
            --fail-under=100
